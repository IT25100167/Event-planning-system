<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ceylon Celebrations — Coordination Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root{
    --bg: #F2F4FE;
    --surface: #FFFFFF;
    --surface-tint: #F0EEFF;
    --lavender: #7B6EF6;
    --lavender-deep: #5D50D9;
    --periwinkle: #9B8AFB;
    --sky: #4FA8E0;
    --ink: #23263B;
    --muted: #7A7F9A;
    --border: #E7E8F5;
    --high: #F0637A;
    --med: #F2A65A;
    --low: #4FA8E0;
    --pending: #A6ABC7;
    --progress: #4FA8E0;
    --done: #3FBE8E;
    --radius-lg: 20px;
    --radius-md: 14px;
    --shadow-sm: 0 1px 2px rgba(35,38,59,0.04);
    --shadow-md: 0 10px 30px rgba(35,38,59,0.08);
    --shadow-lift: 0 16px 40px rgba(93,80,217,0.16);
  }
  *{ box-sizing:border-box; }
  html,body,#root{ height:100%; }
  body{
    margin:0;
    background:
      radial-gradient(1200px 420px at 100% -10%, rgba(123,110,246,0.10), transparent),
      radial-gradient(900px 500px at -10% 15%, rgba(79,168,224,0.10), transparent),
      var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ font-family:'Sora',sans-serif; margin:0; }
  button{ font-family:'Inter',sans-serif; cursor:pointer; }
  ::selection{ background:var(--lavender); color:#fff; }

  @keyframes fadeInUp{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:translateY(0);} }
  @keyframes fadeIn{ from{ opacity:0;} to{ opacity:1;} }
  @keyframes floatBlob{ 0%,100%{ transform:translate(0,0) scale(1);} 50%{ transform:translate(14px,-10px) scale(1.05);} }
  @keyframes shimmer{ 0%{ background-position:-300px 0;} 100%{ background-position:300px 0;} }
  @keyframes popIn{ from{ opacity:0; transform:scale(0.94) translateY(6px);} to{ opacity:1; transform:scale(1) translateY(0);} }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }

  .animate-in{ animation:fadeInUp .45s ease both; }
  .animate-fade{ animation:fadeIn .3s ease both; }

  /* Layout */
  .shell{ display:flex; min-height:100vh; }
  .sidebar{
    width:230px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border);
    padding:28px 20px; display:flex; flex-direction:column; gap:6px; position:sticky; top:0; height:100vh;
  }
  .brand{ display:flex; align-items:center; gap:10px; margin-bottom:32px; padding:0 6px; }
  .brand-mark{
    width:36px; height:36px; border-radius:11px;
    background:linear-gradient(135deg, var(--lavender), var(--sky));
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-family:'Sora',sans-serif; font-weight:700; font-size:15px;
    box-shadow:var(--shadow-lift);
  }
  .brand-name{ font-family:'Sora',sans-serif; font-weight:700; font-size:15px; line-height:1.2; }
  .brand-sub{ font-size:11px; color:var(--muted); }

  .navitem{
    display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:11px;
    color:var(--muted); font-size:14px; font-weight:500; border:none; background:transparent;
    text-align:left; width:100%; transition:background .15s ease, color .15s ease;
  }
  .navitem.active{ background:var(--surface-tint); color:var(--lavender-deep); font-weight:600; }
  .navitem:hover:not(.active){ background:#FAFAFF; }
  .navitem svg{ opacity:.8; flex-shrink:0; }
  .navitem.active svg{ opacity:1; }

  .sidebar-footer{
    margin-top:auto; padding:14px; border-radius:var(--radius-md);
    background:linear-gradient(160deg, var(--surface-tint), #EAF4FC);
    font-size:12px; color:var(--muted); line-height:1.5;
  }

  .main{ flex:1; padding:32px 40px 60px; max-width:1500px; }

  /* Hero */
  .hero{
    position:relative; overflow:hidden; border-radius:24px; padding:32px 36px;
    background:linear-gradient(120deg, var(--lavender-deep), var(--lavender) 55%, var(--sky));
    color:#fff; margin-bottom:26px; box-shadow:var(--shadow-lift);
  }
  .hero-blob{ position:absolute; pointer-events:none; border-radius:999px; filter:blur(2px); opacity:.35; animation:floatBlob 9s ease-in-out infinite; }
  .hero-blob.b1{ width:180px; height:180px; background:#fff; top:-70px; right:60px; }
  .hero-blob.b2{ width:120px; height:120px; background:var(--sky); bottom:-50px; right:220px; animation-delay:2s; }
  .hero-blob.b3{ width:90px; height:90px; background:#fff; top:20px; right:280px; opacity:.18; animation-delay:4s; }
  .hero-inner{ position:relative; display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:24px; }
  .hero-greet{ font-size:0.85rem; opacity:.85; margin-bottom:6px; }
  .hero h1{ font-size:1.9rem; color:#fff; }
  .hero p{ margin:6px 0 0; opacity:.85; font-size:0.92rem; max-width:420px; }
  .hero-progress-wrap{ min-width:220px; }
  .hero-progress-label{ display:flex; justify-content:space-between; font-size:0.78rem; opacity:.85; margin-bottom:6px; }
  .hero-progress-track{ height:8px; border-radius:999px; background:rgba(255,255,255,0.28); overflow:hidden; }
  .hero-progress-fill{ height:100%; border-radius:999px; background:#fff; transition:width .6s ease; }
  .event-select{
    display:flex; align-items:center; gap:8px; background:rgba(255,255,255,0.16);
    border:1px solid rgba(255,255,255,0.3); padding:8px 14px; border-radius:999px; backdrop-filter:blur(4px);
  }
  .event-select label{ font-size:12px; opacity:.85; }
  .event-select input{ border:none; outline:none; width:50px; font-size:14px; font-weight:700; color:#fff; background:transparent; }
  .pill{
    font-size:12px; padding:6px 12px; border-radius:999px; display:inline-flex; align-items:center; gap:6px; font-weight:600;
    background:rgba(255,255,255,0.18); color:#fff; border:1px solid rgba(255,255,255,0.3);
  }
  .pill.err{ background:rgba(240,99,122,0.85); border-color:transparent; }
  .pill .dot{ width:7px; height:7px; border-radius:999px; background:currentColor; }
  .hero-top{ display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:18px; flex-wrap:wrap; }
  .hero-actions{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

  /* Stats */
  .stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:26px; }
  @media (max-width:1000px){ .stats{ grid-template-columns:repeat(2,1fr); } }
  .stat-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:20px;
    display:flex; flex-direction:column; gap:10px; transition:transform .18s ease, box-shadow .18s ease;
  }
  .stat-card:hover{ transform:translateY(-3px); box-shadow:var(--shadow-md); }
  .stat-icon{ width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; }
  .stat-num{ font-family:'Sora',sans-serif; font-size:1.8rem; font-weight:800; }
  .stat-label{ font-size:0.82rem; color:var(--muted); }
  .stat-trend{ font-size:0.72rem; font-weight:700; display:flex; align-items:center; gap:4px; }

  /* Content grid */
  .content{ display:grid; grid-template-columns:1fr 340px; gap:22px; align-items:start; margin-bottom:22px; }
  @media (max-width:1150px){ .content{ grid-template-columns:1fr; } }

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:22px;
    box-shadow:var(--shadow-sm);
  }
  .card-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; gap:12px; flex-wrap:wrap; }
  .card-head h2{ font-size:1.05rem; }

  .btn{
    border-radius:11px; padding:10px 16px; font-size:0.86rem; font-weight:600; border:none;
    display:inline-flex; align-items:center; gap:8px; transition:transform .12s ease, opacity .15s ease, background .15s ease;
  }
  .btn:active{ transform:scale(0.96); }
  .btn-primary{ background:#fff; color:var(--lavender-deep); }
  .btn-primary:hover{ background:#F4F2FF; }
  .btn-outline{ background:transparent; border:1px solid var(--border); color:var(--ink); }
  .btn-outline:hover{ background:var(--surface-tint); }
  .btn-icon{
    width:32px; height:32px; padding:0; border-radius:10px; display:flex; align-items:center; justify-content:center;
    background:var(--surface-tint); border:none; color:var(--ink); transition:background .15s ease, transform .12s ease;
  }
  .btn-icon:hover{ background:#E4E1FF; transform:translateY(-1px); }
  .btn-danger-ghost{ color:var(--high); background:#FDEBEE; }
  .btn-danger-ghost:hover{ background:#FBDBE0; }

  .searchbar{
    display:flex; align-items:center; gap:8px; background:var(--bg); border:1px solid var(--border);
    border-radius:11px; padding:8px 12px; font-size:0.86rem; flex:1; min-width:160px;
  }
  .searchbar input{ border:none; background:transparent; outline:none; width:100%; font-size:0.86rem; }

  .tabs{ display:flex; gap:4px; background:var(--bg); padding:4px; border-radius:11px; }
  .tab{
    border:none; background:transparent; padding:7px 16px; border-radius:8px; font-size:0.82rem; font-weight:700; color:var(--muted);
    transition:background .15s ease, color .15s ease;
  }
  .tab.active{ background:var(--surface); color:var(--lavender-deep); box-shadow:var(--shadow-sm); }

  .filters{ display:flex; gap:8px; flex-wrap:wrap; }
  .filter-chip{
    font-size:0.78rem; padding:6px 12px; border-radius:999px; border:1px solid var(--border); background:transparent;
    color:var(--muted); font-weight:600; transition:background .15s ease, color .15s ease;
  }
  .filter-chip.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .filter-chip:hover:not(.active){ background:var(--surface-tint); }

  /* Task list */
  .task-row{
    display:grid; grid-template-columns:1fr 90px 100px 150px 150px 40px; gap:12px; align-items:center;
    padding:14px 6px; border-bottom:1px solid var(--border); transition:background .15s ease;
  }
  .task-row:hover{ background:#FAFAFF; }
  .task-row:last-child{ border-bottom:none; }
  .task-row-head{ font-size:0.7rem; text-transform:uppercase; letter-spacing:0.04em; color:var(--muted); padding:0 6px 10px; border-bottom:1px solid var(--border); }
  .task-title{ font-weight:600; font-size:0.92rem; }
  .task-desc{ color:var(--muted); font-size:0.8rem; margin-top:2px; }
  .task-due{ font-size:0.85rem; color:var(--ink); }
  .task-due.overdue{ color:var(--high); font-weight:700; }

  .badge{ display:inline-flex; align-items:center; gap:6px; font-size:0.74rem; font-weight:700; padding:4px 10px; border-radius:999px; }
  .badge.HIGH{ background:#FDEBEE; color:var(--high); }
  .badge.MEDIUM{ background:#FEF3E7; color:var(--med); }
  .badge.LOW{ background:#EAF4FC; color:var(--low); }

  .status-select{
    font-size:0.76rem; font-weight:700; padding:6px 10px; border-radius:999px; border:1px solid var(--border);
    background:var(--bg); color:var(--ink);
  }
  .status-select.PENDING{ color:var(--pending); }
  .status-select.IN_PROGRESS{ color:var(--progress); }
  .status-select.COMPLETED{ color:var(--done); }

  .assignee{ display:flex; align-items:center; gap:8px; font-size:0.82rem; }
  .avatar{
    width:26px; height:26px; border-radius:999px; display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:0.68rem; font-weight:800; flex-shrink:0; font-family:'Sora',sans-serif;
  }

  .empty-state{ text-align:center; padding:60px 20px; color:var(--muted); }
  .empty-state svg{ opacity:.5; margin-bottom:12px; }

  .skeleton-row{ height:52px; border-radius:10px; margin-bottom:8px;
    background:linear-gradient(90deg, #F1F1FA 25%, #F8F8FD 37%, #F1F1FA 63%);
    background-size:600px 100%; animation:shimmer 1.4s linear infinite; }

  /* Board */
  .board{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  @media (max-width:820px){ .board{ grid-template-columns:1fr; } }
  .board-col{
    background:var(--bg); border-radius:var(--radius-md); padding:12px; min-height:120px;
    border:1.5px dashed transparent; transition:border-color .15s ease, background .15s ease;
  }
  .board-col.drag-over{ border-color:var(--lavender); background:#EFEBFF; }
  .board-col-head{ display:flex; align-items:center; justify-content:space-between; padding:2px 6px 10px; }
  .board-col-title{ font-size:0.8rem; font-weight:700; display:flex; align-items:center; gap:8px; }
  .board-col-dot{ width:8px; height:8px; border-radius:999px; }
  .board-count{ font-size:0.72rem; color:var(--muted); background:var(--surface); padding:2px 8px; border-radius:999px; }
  .board-card{
    background:var(--surface); border-radius:12px; padding:12px 14px; margin-bottom:10px; cursor:grab;
    box-shadow:var(--shadow-sm); transition:box-shadow .15s ease, transform .15s ease; border:1px solid var(--border);
  }
  .board-card:hover{ box-shadow:var(--shadow-md); transform:translateY(-2px); }
  .board-card:active{ cursor:grabbing; }
  .board-card-title{ font-weight:600; font-size:0.86rem; margin-bottom:8px; }
  .board-card-foot{ display:flex; align-items:center; justify-content:space-between; margin-top:10px; }

  /* Donut */
  .donut-wrap{ display:flex; align-items:center; gap:20px; }
  .donut-legend{ display:flex; flex-direction:column; gap:8px; font-size:0.8rem; }
  .legend-row{ display:flex; align-items:center; gap:8px; }
  .legend-dot{ width:9px; height:9px; border-radius:999px; }
  .legend-val{ margin-left:auto; font-weight:700; color:var(--ink); }

  /* Priority bars */
  .pbar-row{ margin-bottom:12px; }
  .pbar-row:last-child{ margin-bottom:0; }
  .pbar-label{ display:flex; justify-content:space-between; font-size:0.78rem; margin-bottom:5px; color:var(--muted); font-weight:600; }
  .pbar-track{ height:8px; border-radius:999px; background:var(--bg); overflow:hidden; }
  .pbar-fill{ height:100%; border-radius:999px; transition:width .6s ease; }

  /* Workload */
  .workload-row{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); }
  .workload-row:last-child{ border-bottom:none; }
  .workload-info{ flex:1; min-width:0; }
  .workload-name{ font-size:0.85rem; font-weight:600; margin-bottom:5px; }
  .workload-track{ height:6px; border-radius:999px; background:var(--bg); overflow:hidden; }
  .workload-fill{ height:100%; background:linear-gradient(90deg, var(--lavender), var(--sky)); border-radius:999px; transition:width .6s ease; }
  .workload-count{ font-size:0.75rem; color:var(--muted); white-space:nowrap; }

  /* Activity */
  .activity-row{ display:flex; gap:10px; padding:9px 0; }
  .activity-dot{ width:8px; height:8px; border-radius:999px; margin-top:6px; flex-shrink:0; }
  .activity-text{ font-size:0.83rem; }
  .activity-time{ font-size:0.72rem; color:var(--muted); margin-top:1px; }

  /* Calendar */
  .cal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .cal-month{ font-weight:700; font-size:0.95rem; }
  .cal-nav{ display:flex; gap:6px; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cal-dow{ font-size:0.66rem; color:var(--muted); text-align:center; padding-bottom:6px; font-weight:700; }
  .cal-day{
    aspect-ratio:1; border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:0.78rem; position:relative; color:var(--ink); background:transparent; border:1px solid transparent;
    transition:background .12s ease, transform .12s ease;
  }
  .cal-day:not(.muted):hover{ background:var(--surface-tint); transform:scale(1.05); }
  .cal-day.muted{ color:var(--border); }
  .cal-day.today{ border-color:var(--lavender); font-weight:700; }
  .cal-day.selected{ background:var(--lavender); color:#fff; }
  .cal-dots{ position:absolute; bottom:4px; display:flex; gap:2px; }
  .cal-dots span{ width:4px; height:4px; border-radius:999px; }
  .cal-legend{ display:flex; gap:12px; margin-top:14px; font-size:0.72rem; color:var(--muted); flex-wrap:wrap; }
  .cal-legend span{ display:inline-flex; align-items:center; gap:5px; }
  .cal-clear{ margin-top:12px; width:100%; }

  .upcoming-item{ display:flex; justify-content:space-between; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--border); gap:10px; }
  .upcoming-item:last-child{ border-bottom:none; }
  .upcoming-title{ font-size:0.85rem; font-weight:600; }
  .upcoming-date{ font-size:0.75rem; color:var(--muted); margin-top:2px; }

  .bottom-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:22px; }
  @media (max-width:1000px){ .bottom-row{ grid-template-columns:1fr; } }

  /* Modal */
  .overlay{ position:fixed; inset:0; background:rgba(35,38,59,0.4); backdrop-filter:blur(2px);
    display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; animation:fadeIn .2s ease; }
  .modal{
    background:var(--surface); border-radius:var(--radius-lg); width:100%; max-width:480px; padding:28px;
    box-shadow:0 30px 60px rgba(35,38,59,0.3); animation:popIn .25s cubic-bezier(.2,.9,.3,1.2);
  }
  .modal h2{ margin-bottom:20px; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:0.78rem; color:var(--muted); margin-bottom:6px; font-weight:600; }
  .field input, .field select, .field textarea{
    width:100%; padding:10px 12px; border-radius:11px; border:1px solid var(--border);
    background:var(--bg); font-family:'Inter',sans-serif; font-size:0.88rem; color:var(--ink);
    transition:border-color .15s ease;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--lavender); }
  .field textarea{ resize:vertical; min-height:64px; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:22px; }
  .form-error{ color:var(--high); font-size:0.82rem; margin-top:4px; min-height:18px; }
  .hero-blob{ pointer-events:none; }
  .hero-top{ position:relative; z-index:2; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, useCallback, useRef } = React;
const API_BASE = "";

/* ---------- icons ---------- */
const Icon = {
  grid: (p) => (<svg width="16" height="16" viewBox="0 0 24 24" fill="none" {...p}><rect x="3" y="3" width="7" height="7" rx="2" stroke="currentColor" strokeWidth="1.8"/><rect x="14" y="3" width="7" height="7" rx="2" stroke="currentColor" strokeWidth="1.8"/><rect x="3" y="14" width="7" height="7" rx="2" stroke="currentColor" strokeWidth="1.8"/><rect x="14" y="14" width="7" height="7" rx="2" stroke="currentColor" strokeWidth="1.8"/></svg>),
  tasks: (p) => (<svg width="16" height="16" viewBox="0 0 24 24" fill="none" {...p}><path d="M9 6h11M9 12h11M9 18h11" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>),
  calendar: (p) => (<svg width="16" height="16" viewBox="0 0 24 24" fill="none" {...p}><rect x="3" y="5" width="18" height="16" rx="3" stroke="currentColor" strokeWidth="1.8"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg>),
  team: (p) => (<svg width="16" height="16" viewBox="0 0 24 24" fill="none" {...p}><circle cx="9" cy="8" r="3" stroke="currentColor" strokeWidth="1.8"/><circle cx="17" cy="10" r="2.4" stroke="currentColor" strokeWidth="1.8"/><path d="M3 20c0-3 2.7-5 6-5s6 2 6 5M14 20c0-2.2 1.6-4 4-4.2" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg>),
  plus: (p) => (<svg width="14" height="14" viewBox="0 0 24 24" fill="none" {...p}><path d="M12 5v14M5 12h14" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"/></svg>),
  trash: (p) => (<svg width="14" height="14" viewBox="0 0 24 24" fill="none" {...p}><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>),
  chevL: (p) => (<svg width="14" height="14" viewBox="0 0 24 24" fill="none" {...p}><path d="M15 6l-6 6 6 6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>),
  chevR: (p) => (<svg width="14" height="14" viewBox="0 0 24 24" fill="none" {...p}><path d="M9 6l6 6-6 6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>),
  clock: (p) => (<svg width="20" height="20" viewBox="0 0 24 24" fill="none" {...p}><circle cx="12" cy="12" r="9" stroke="currentColor" strokeWidth="1.8"/><path d="M12 7v5l3 3" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg>),
  bolt: (p) => (<svg width="20" height="20" viewBox="0 0 24 24" fill="none" {...p}><path d="M13 3L5 14h6l-1 7 9-12h-6l1-6z" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round"/></svg>),
  check: (p) => (<svg width="20" height="20" viewBox="0 0 24 24" fill="none" {...p}><path d="M20 6L9 17l-5-5" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>),
  layers: (p) => (<svg width="20" height="20" viewBox="0 0 24 24" fill="none" {...p}><path d="M12 3l9 5-9 5-9-5 9-5z" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round"/><path d="M3 13l9 5 9-5" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round"/></svg>),
  empty: (p) => (<svg width="44" height="44" viewBox="0 0 24 24" fill="none" {...p}><rect x="4" y="6" width="16" height="14" rx="2" stroke="currentColor" strokeWidth="1.5"/><path d="M4 10h16M9 3v3M15 3v3" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>),
  up: (p) => (<svg width="12" height="12" viewBox="0 0 24 24" fill="none" {...p}><path d="M5 15l7-7 7 7" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></svg>),
};

const PRIORITIES = ["LOW","MEDIUM","HIGH"];
const STATUSES = ["PENDING","IN_PROGRESS","COMPLETED"];
const STATUS_META = {
  PENDING:{ label:"Pending", color:"var(--pending)" },
  IN_PROGRESS:{ label:"In progress", color:"var(--sky)" },
  COMPLETED:{ label:"Completed", color:"var(--done)" },
};
const PRIORITY_COLOR = { HIGH:"var(--high)", MEDIUM:"var(--med)", LOW:"var(--low)", MILESTONE:"var(--lavender-deep)" };
const AVATAR_PALETTE = ["#7B6EF6","#4FA8E0","#3FBE8E","#F2A65A","#9B8AFB","#F0637A"];
const todayISO = () => new Date().toLocaleDateString('en-CA');

function hashColor(name){
  const s = name || "Unassigned";
  let h = 0;
  for(let i=0;i<s.length;i++) h = s.charCodeAt(i) + ((h<<5)-h);
  return AVATAR_PALETTE[Math.abs(h) % AVATAR_PALETTE.length];
}
function initials(name){
  if(!name) return "?";
  const parts = name.trim().split(/\s+/);
  return (parts[0][0] + (parts[1] ? parts[1][0] : "")).toUpperCase();
}

/* count-up hook */
function useCountUp(target, duration=700){
  const [val, setVal] = useState(0);
  const startRef = useRef(null);
  useEffect(() => {
    let raf;
    startRef.current = null;
    const from = 0;
    const step = (ts) => {
      if(!startRef.current) startRef.current = ts;
      const progress = Math.min((ts - startRef.current) / duration, 1);
      const eased = 1 - Math.pow(1-progress, 3);
      setVal(Math.round(from + (target-from)*eased));
      if(progress < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [target, duration]);
  return val;
}

function relativeTime(iso){
  const then = new Date(iso).getTime();
  const diffMin = Math.max(1, Math.round((Date.now()-then)/60000));
  if(diffMin < 60) return `${diffMin}m ago`;
  const diffH = Math.round(diffMin/60);
  if(diffH < 24) return `${diffH}h ago`;
  const diffD = Math.round(diffH/24);
  return `${diffD}d ago`;
}
function formatNice(iso){
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString(undefined, { month:'short', day:'numeric' });
}

function App(){
  const [eventId, setEventId] = useState(1);
  const [tasks, setTasks] = useState([]);
  const [loading, setLoading] = useState(true);
  const [apiOk, setApiOk] = useState(null);
  const [search, setSearch] = useState("");
  const [statusFilter, setStatusFilter] = useState("ALL");
  const [selectedDate, setSelectedDate] = useState(null);
  const [showForm, setShowForm] = useState(false);
  const [view, setView] = useState("list");
  const [page, setPage] = useState("dashboard");
  const [calMonth, setCalMonth] = useState(() => { const d = new Date(); return { y: d.getFullYear(), m: d.getMonth() }; });
  const [dragOverCol, setDragOverCol] = useState(null);
    const [calendar, setCalendar] = useState([]);
  const [calTick, setCalTick] = useState(0);
  useEffect(() => {
    fetch(`${API_BASE}/calendar/event/${eventId}`)
      .then(r => r.ok ? r.json() : [])
      .then(setCalendar)
      .catch(() => setCalendar([]));
  }, [eventId, tasks, calTick]);

  const loadTasks = useCallback(async (id) => {
    setLoading(true);
    try{
      const res = await fetch(`${API_BASE}/tasks/event/${id}`);
      if(res.ok){ setTasks(await res.json()); setApiOk(true); }
      else if(res.status === 404){ setTasks([]); setApiOk(true); }
      else { setApiOk(false); }
    }catch(e){ setApiOk(false); }
    setLoading(false);
  }, []);

  useEffect(() => { loadTasks(eventId); }, [eventId, loadTasks]);

  const updateStatus = async (id, status) => {
    try{
      await fetch(`${API_BASE}/tasks/${id}/status`, {
        method:"PATCH", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ status })
      });
      loadTasks(eventId);
    }catch(e){ alert("Could not update status — check the API is running."); }
  };

  const deleteTask = async (id) => {
    if(!confirm("Delete this task?")) return;
    try{ await fetch(`${API_BASE}/tasks/${id}`, { method:"DELETE" }); loadTasks(eventId); }
    catch(e){ alert("Could not delete task — check the API is running."); }
  };

  const filtered = useMemo(() => tasks.filter(t => {
    if(statusFilter !== "ALL" && t.status !== statusFilter) return false;
    if(selectedDate && t.dueDate !== selectedDate) return false;
    if(search && !t.title.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  }), [tasks, statusFilter, selectedDate, search]);

  const stats = useMemo(() => ({
    total: tasks.length,
    pending: tasks.filter(t=>t.status==="PENDING").length,
    progress: tasks.filter(t=>t.status==="IN_PROGRESS").length,
    done: tasks.filter(t=>t.status==="COMPLETED").length,
  }), [tasks]);

  const completionPct = stats.total ? Math.round((stats.done/stats.total)*100) : 0;

  const upcoming = useMemo(() => [...tasks]
    .filter(t => t.status !== "COMPLETED")
    .sort((a,b) => a.dueDate.localeCompare(b.dueDate)).slice(0,5), [tasks]);

  const priorityCounts = useMemo(() => {
    const c = { HIGH:0, MEDIUM:0, LOW:0 };
    tasks.forEach(t => c[t.priority]++);
    return c;
  }, [tasks]);
  const maxPriority = Math.max(1, ...Object.values(priorityCounts));

  const workload = useMemo(() => {
    const map = {};
    tasks.forEach(t => {
      const name = t.assigneeName || "Unassigned";
      if(!map[name]) map[name] = { name, total:0, done:0 };
      map[name].total++;
      if(t.status === "COMPLETED") map[name].done++;
    });
    return Object.values(map).sort((a,b) => b.total - a.total).slice(0,5);
  }, [tasks]);

  const activity = useMemo(() => [...tasks]
    .filter(t => t.createdAt)
    .sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt))
    .slice(0,5), [tasks]);

  const greeting = useMemo(() => {
    const h = new Date().getHours();
    if(h < 12) return "Good morning";
    if(h < 18) return "Good afternoon";
    return "Good evening";
  }, []);

  return (
    <div className="shell">
     <Sidebar page={page} setPage={setPage} />
      <div className="main">
       <Hero
          eventId={eventId} setEventId={setEventId} apiOk={apiOk} onNew={()=>setShowForm(true)}
          greeting={greeting} completionPct={completionPct} total={stats.total} page={page}
        />
        {page==="dashboard" && <Stats stats={stats} />}
         <div className="content" style={page==="dashboard" ? undefined : {display:"none"}}>
          <div className="card animate-in">
            <div className="card-head">

                </div>
              </div>
              <div className="searchbar" style={{maxWidth:220}}>
                <input placeholder="Search tasks…" value={search} onChange={e=>setSearch(e.target.value)} />
              </div>
            </div>

            {view === "list" && (
              <div className="filters" style={{marginBottom:16}}>
                {["ALL",...STATUSES].map(s => (
                  <button key={s} className={"filter-chip" + (statusFilter===s ? " active":"")} onClick={()=>setStatusFilter(s)}>
                    {s === "ALL" ? "All" : STATUS_META[s].label}
                  </button>
                ))}
                {selectedDate && <button className="filter-chip" onClick={()=>setSelectedDate(null)}>✕ {formatNice(selectedDate)}</button>}
              </div>
            )}

            {loading ? (
              <div>{[0,1,2,3].map(i => <div className="skeleton-row" key={i} />)}</div>
            ) : view === "list" ? (
              filtered.length === 0 ? (
                <div className="empty-state"><Icon.empty/><div>No tasks match right now. Try "New task" to add one.</div></div>
              ) : (
                <div className="animate-fade" key={statusFilter+search+selectedDate}>
                  <div className="task-row task-row-head">
                    <span>Task</span><span>Priority</span><span>Due</span><span>Status</span><span>Assignee</span><span></span>
                  </div>
                  {filtered.map((t,i) => (
                    <div className="task-row animate-in" style={{animationDelay:`${i*35}ms`}} key={t.id}>
                      <div>
                        <div className="task-title">{t.title}</div>
                        {t.description ? <div className="task-desc">{t.description}</div> : null}
                        {t.milestoneName ? <div className="task-desc" style={{color:"var(--lavender-deep)", fontWeight:600}}>🏁 {t.milestoneName}</div> : null}
                      </div>
                      <div><span className={`badge ${t.priority}`}>{t.priority}</span></div>
                      <div className={"task-due" + (t.status!=="COMPLETED" && t.dueDate<todayISO() ? " overdue":"")}>{formatNice(t.dueDate)}</div>
                      <div>
                        <select className={`status-select ${t.status}`} value={t.status} onChange={e=>updateStatus(t.id, e.target.value)}>
                          {STATUSES.map(s => <option key={s} value={s}>{STATUS_META[s].label}</option>)}
                        </select>
                      </div>
                      <div className="assignee">
                        <span className="avatar" style={{background:hashColor(t.assigneeName)}}>{initials(t.assigneeName)}</span>
                        {t.assigneeName || <span style={{color:"var(--muted)"}}>Unassigned</span>}
                      </div>
                      <button className="btn-icon btn-danger-ghost" onClick={()=>deleteTask(t.id)} title="Delete"><Icon.trash/></button>
                    </div>
                  ))}
                </div>
              )
            ) : (
              <BoardView
                tasks={filtered} onStatus={updateStatus} onDelete={deleteTask}
                dragOverCol={dragOverCol} setDragOverCol={setDragOverCol}
              />
            )}
          </div>

          <div style={{display:"flex", flexDirection:"column", gap:22}}>
            <div className="card animate-in" style={{animationDelay:"60ms"}}>
              <MiniCalendar calMonth={calMonth} setCalMonth={setCalMonth} entries={calendar}
                selectedDate={selectedDate} setSelectedDate={setSelectedDate} />
            </div>
            <div className="card animate-in" style={{animationDelay:"100ms"}}>
              <div className="card-head"><h2>Status breakdown</h2></div>
              <StatusDonut stats={stats} />
            </div>
            <div className="card animate-in" style={{animationDelay:"140ms"}}>
              <div className="card-head"><h2>Upcoming</h2></div>
              {upcoming.length === 0 ? (
                <div style={{color:"var(--muted)", fontSize:"0.85rem"}}>Nothing on the horizon.</div>
              ) : upcoming.map(t => (
                <div className="upcoming-item" key={t.id}>
                  <div>
                    <div className="upcoming-title">{t.title}</div>
                    <div className="upcoming-date">{formatNice(t.dueDate)}</div>
                  </div>
                  <span className={`badge ${t.priority}`}>{t.priority}</span>
                </div>
              ))}
            </div>
          </div>
        </div>

         <div className="bottom-row" style={page==="team" ? undefined : {display:"none"}}>
          <div className="card animate-in" style={{animationDelay:"120ms"}}>
            <div className="card-head"><h2>Priority breakdown</h2></div>
            {PRIORITIES.slice().reverse().map(p => (
              <div className="pbar-row" key={p}>
                <div className="pbar-label"><span>{p}</span><span>{priorityCounts[p]}</span></div>
                <div className="pbar-track">
                  <div className="pbar-fill" style={{ width: `${(priorityCounts[p]/maxPriority)*100}%`, background: PRIORITY_COLOR[p] }} />
                </div>
              </div>
            ))}
          </div>

          <div className="card animate-in" id="team" style={{animationDelay:"160ms"}}>
            <div className="card-head"><h2>Team workload</h2><Icon.team style={{color:"var(--muted)"}}/></div>
            {workload.length === 0 ? (
              <div style={{color:"var(--muted)", fontSize:"0.85rem"}}>No assignees yet.</div>
            ) : workload.map(w => (
              <div className="workload-row" key={w.name}>
                <span className="avatar" style={{background:hashColor(w.name)}}>{initials(w.name)}</span>
                <div className="workload-info">
                  <div className="workload-name">{w.name}</div>
                  <div className="workload-track">
                    <div className="workload-fill" style={{ width: `${w.total ? (w.done/w.total)*100 : 0}%` }} />
                  </div>
                </div>
                <span className="workload-count">{w.done}/{w.total}</span>
              </div>
            ))}
          </div>

          <div className="card animate-in" style={{animationDelay:"200ms"}}>
            <div className="card-head"><h2>Recent activity</h2></div>
            {activity.length === 0 ? (
              <div style={{color:"var(--muted)", fontSize:"0.85rem"}}>No activity yet.</div>
            ) : activity.map(t => (
              <div className="activity-row" key={t.id}>
                <span className="activity-dot" style={{background: PRIORITY_COLOR[t.priority]}} />
                <div>
                  <div className="activity-text"><strong>{t.title}</strong> was created</div>
                  <div className="activity-time">{relativeTime(t.createdAt)}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
          {page==="milestones" && <MilestonesCard eventId={eventId} onChanged={()=>setCalTick(t=>t+1)} />}
          {page==="messages" && <MessagesCard eventId={eventId} />}
          {page==="notifications" && <NotificationsCard />}
    </div>

      {showForm && (
        <TaskFormModal eventId={eventId} onClose={()=>setShowForm(false)} onCreated={()=>{ setShowForm(false); loadTasks(eventId); }} />
      )}
    </div>
  );
}

function Stats({ stats }){
  const total = useCountUp(stats.total);
  const pending = useCountUp(stats.pending);
  const progress = useCountUp(stats.progress);
  const done = useCountUp(stats.done);
  const cards = [
    { label:"Total tasks", value: total, icon: Icon.layers, bg:"#EFEBFF", color:"var(--lavender-deep)" },
    { label:"Pending", value: pending, icon: Icon.clock, bg:"#EEF0FA", color:"var(--pending)" },
    { label:"In progress", value: progress, icon: Icon.bolt, bg:"#EAF4FC", color:"var(--sky)" },
    { label:"Completed", value: done, icon: Icon.check, bg:"#E4F8EF", color:"var(--done)" },
  ];
  return (
    <div className="stats">
      {cards.map((c,i) => (
        <div className="stat-card animate-in" style={{animationDelay:`${i*50}ms`}} key={c.label}>
          <div className="stat-icon" style={{background:c.bg, color:c.color}}><c.icon/></div>
          <div className="stat-num">{c.value}</div>
          <div className="stat-label">{c.label}</div>
        </div>
      ))}
    </div>
  );
}

function StatusDonut({ stats }){
  const total = stats.total || 1;
  const segs = [
    { key:"PENDING", val: stats.pending, color:"var(--pending)" },
    { key:"IN_PROGRESS", val: stats.progress, color:"var(--sky)" },
    { key:"COMPLETED", val: stats.done, color:"var(--done)" },
  ];
  const r = 42, c = 2*Math.PI*r;
  let offset = 0;
  return (
    <div className="donut-wrap">
      <svg width="110" height="110" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r={r} fill="none" stroke="#EEF0FA" strokeWidth="12" />
        {segs.map(s => {
          const len = (s.val/total) * c;
          const el = (
            <circle key={s.key} cx="50" cy="50" r={r} fill="none" stroke={s.color} strokeWidth="12"
              strokeDasharray={`${len} ${c-len}`} strokeDashoffset={-offset}
              transform="rotate(-90 50 50)" strokeLinecap="round" style={{transition:"stroke-dasharray .6s ease"}} />
          );
          offset += len;
          return el;
        })}
        <text x="50" y="47" textAnchor="middle" fontSize="16" fontWeight="800" fill="var(--ink)" fontFamily="Sora">{stats.total}</text>
        <text x="50" y="61" textAnchor="middle" fontSize="7.5" fill="var(--muted)">tasks</text>
      </svg>
      <div className="donut-legend">
        {segs.map(s => (
          <div className="legend-row" key={s.key}>
            <span className="legend-dot" style={{background:s.color}}></span>
            {STATUS_META[s.key].label}
            <span className="legend-val">{s.val}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

  const byStatus = (s) => tasks.filter(t => t.status === s);
  return (
    <div className="board">
      {STATUSES.map(s => (
        <div
          key={s}

          onDragLeave={()=>setDragOverCol(null)}
          onDrop={(e)=>{
            e.preventDefault();
            const id = e.dataTransfer.getData("text/plain");
            if(id) onStatus(Number(id), s);
            setDragOverCol(null);
          }}
        >
          <div className="board-col-head">
            <div className="board-col-title"><span className="board-col-dot" style={{background:STATUS_META[s].color}}></span>{STATUS_META[s].label}</div>
            <span className="board-count">{byStatus(s).length}</span>
          </div>
          {byStatus(s).map(t => (
            <div className="board-card" key={t.id} draggable
              onDragStart={(e)=>e.dataTransfer.setData("text/plain", String(t.id))}>
              <div className="board-card-title">{t.title}</div>
              <span className={`badge ${t.priority}`}>{t.priority}</span>
              <div className="board-card-foot">
                <div className="assignee">
                  <span className="avatar" style={{width:22,height:22,fontSize:"0.6rem",background:hashColor(t.assigneeName)}}>{initials(t.assigneeName)}</span>
                </div>
                <span style={{fontSize:"0.72rem", color:"var(--muted)"}}>{formatNice(t.dueDate)}</span>
                <button className="btn-icon btn-danger-ghost" style={{width:26,height:26}} onClick={()=>onDelete(t.id)}><Icon.trash/></button>
              </div>
            </div>
          ))}
          {byStatus(s).length === 0 && <div style={{fontSize:"0.78rem", color:"var(--muted)", padding:"10px 4px"}}>Drop tasks here</div>}
        </div>
      ))}
    </div>
  );
}

function MiniCalendar({ calMonth, setCalMonth, entries, selectedDate, setSelectedDate }){
  const { y, m } = calMonth;
  const first = new Date(y, m, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const daysInPrev = new Date(y, m, 0).getDate();
  const today = todayISO();

    const dueMap = useMemo(() => {
    const map = {};
    entries.forEach(e => { (map[e.date] = map[e.date] || []).push(e.type === "MILESTONE" ? "MILESTONE" : e.priority); });
    return map;
  }, [entries]);

  const cells = [];
  for(let i=0;i<startDow;i++) cells.push({ day: daysInPrev - startDow + 1 + i, muted:true });
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    cells.push({ day:d, iso, muted:false, priorities: dueMap[iso] || [], isToday: iso===today, selected: iso===selectedDate });
  }
  while(cells.length % 7 !== 0) cells.push({ day: cells.length, muted:true });

  const monthName = first.toLocaleString(undefined, { month:'long', year:'numeric' });
  const shiftMonth = (delta) => { const nd = new Date(y, m+delta, 1); setCalMonth({ y: nd.getFullYear(), m: nd.getMonth() }); };

  return (
    <div>
      <div className="cal-head">
        <div className="cal-month">{monthName}</div>
        <div className="cal-nav">
          <button className="btn-icon" onClick={()=>shiftMonth(-1)}><Icon.chevL/></button>
          <button className="btn-icon" onClick={()=>shiftMonth(1)}><Icon.chevR/></button>
        </div>
      </div>
      <div className="cal-grid">
        {["S","M","T","W","T","F","S"].map((d,i) => <div className="cal-dow" key={i}>{d}</div>)}
        {cells.map((c,i) => (
          <button key={i}
            className={"cal-day" + (c.muted ? " muted":"") + (c.isToday?" today":"") + (c.selected?" selected":"")}
            disabled={c.muted}
            onClick={() => c.iso && setSelectedDate(c.selected ? null : c.iso)}
          >
            {c.day}
            {c.priorities && c.priorities.length > 0 && (
              <span className="cal-dots">
                {c.priorities.slice(0,3).map((p,idx) => <span key={idx} style={{background: c.selected ? "#fff" : PRIORITY_COLOR[p]}}></span>)}
              </span>
            )}
          </button>
        ))}
      </div>
      <div className="cal-legend">
        <span><span className="legend-dot" style={{background:"var(--high)"}}></span>High</span>
        <span><span className="legend-dot" style={{background:"var(--med)"}}></span>Medium</span>
        <span><span className="legend-dot" style={{background:"var(--low)"}}></span>Low</span>
        <span><span className="legend-dot" style={{background:"var(--lavender-deep)"}}></span>Milestone</span>

      </div>
            {selectedDate && entries.filter(e => e.date===selectedDate && e.type==="MILESTONE").map(e => (
        <div key={"m"+e.id} style={{marginTop:10, fontSize:"0.82rem", fontWeight:600, color:"var(--lavender-deep)"}}>🏁 {e.title}</div>
      ))}
      {selectedDate && <button className="btn btn-outline cal-clear" onClick={()=>setSelectedDate(null)}>Clear date filter</button>}
    </div>
  );
}

function TaskFormModal({ eventId, onClose, onCreated }){
  const [title, setTitle] = useState("");
  const [description, setDescription] = useState("");
  const [priority, setPriority] = useState("MEDIUM");
  const [dueDate, setDueDate] = useState(todayISO());
  const [assigneeId, setAssigneeId] = useState("");
  const [error, setError] = useState("");
  const [saving, setSaving] = useState(false);
    const [milestoneId, setMilestoneId] = useState("");
  const [milestones, setMilestones] = useState([]);
  useEffect(() => {
    fetch(`${API_BASE}/milestones/event/${eventId}`)
      .then(r => r.ok ? r.json() : [])
      .then(setMilestones)
      .catch(() => setMilestones([]));
  }, [eventId]);

  const submit = async (e) => {
    e.preventDefault();
    setError(""); setSaving(true);
    const body = { title, description, priority, dueDate, eventId };
    if(assigneeId) body.assigneeId = Number(assigneeId);
        if(milestoneId) body.milestoneId = Number(milestoneId);
    try{
      const res = await fetch(`${API_BASE}/tasks`, { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(body) });
      const data = await res.json();
      if(!res.ok){ setError(data.message || "Could not create task."); setSaving(false); return; }
      onCreated();
    }catch(err){ setError("Network error — is the API running?"); setSaving(false); }
  };

  return (
    <div className="overlay" onMouseDown={(e)=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="modal">
        <h2>New task</h2>
        <form onSubmit={submit}>
          <div className="field"><label>Title</label>
            <input required value={title} onChange={e=>setTitle(e.target.value)} placeholder="e.g. Confirm floral arrangements" /></div>
          <div className="field"><label>Description</label>
            <textarea value={description} onChange={e=>setDescription(e.target.value)} placeholder="Optional details" /></div>
          <div className="field-row">
            <div className="field"><label>Priority</label>
              <select value={priority} onChange={e=>setPriority(e.target.value)}>{PRIORITIES.map(p => <option key={p} value={p}>{p}</option>)}</select></div>
            <div className="field"><label>Due date</label>
              <input type="date" required value={dueDate} onChange={e=>setDueDate(e.target.value)} /></div>
          </div>
          <div className="field"><label>Assignee ID (optional)</label>
            <input type="number" min="1" value={assigneeId} onChange={e=>setAssigneeId(e.target.value)} placeholder="user id" /></div>
          <div className="field"><label>Milestone (optional)</label>
        <select value={milestoneId} onChange={e=>setMilestoneId(e.target.value)}>
      <option value="">None</option>
    {milestones.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
  </select></div>
          <div className="form-error">{error}</div>
          <div className="modal-actions">
            <button type="button" className="btn btn-outline" onClick={onClose}>Cancel</button>
            <button type="submit" className="btn btn-primary" style={{background:"var(--lavender)", color:"#fff"}} disabled={saving}>{saving ? "Saving…" : "Create task"}</button>
          </div>
        </form>
      </div>
    </div>
  );
}
function MilestonesCard({ eventId, onChanged }){
  const [items, setItems] = useState([]);
  const [name, setName] = useState("");
  const [description, setDescription] = useState("");
  const [dueDate, setDueDate] = useState(todayISO());
  const [error, setError] = useState("");

  const load = useCallback(async () => {
    try{
      const res = await fetch(`${API_BASE}/milestones/event/${eventId}`);
      setItems(res.ok ? await res.json() : []);
    }catch(e){ setItems([]); }
  }, [eventId]);

  useEffect(() => { load(); }, [load]);

  const add = async (e) => {
    e.preventDefault();
    setError("");
    try{
      const res = await fetch(`${API_BASE}/milestones`, {
        method:"POST", headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ name, description, dueDate, eventId })
      });
      if(!res.ok){ setError("Could not add milestone."); return; }
      setName(""); setDescription(""); load(); onChanged && onChanged();
    }catch(err){ setError("Network error — is the API running?"); }
  };

  const remove = async (id) => {
    if(!confirm("Delete this milestone?")) return;
    await fetch(`${API_BASE}/milestones/${id}`, { method:"DELETE" });
    load(); onChanged && onChanged();
  };

  const sorted = [...items].sort((a,b) => a.dueDate.localeCompare(b.dueDate));

  return (
    <div className="card animate-in" id="milestones" style={{marginTop:22}}>
      <div className="card-head"><h2>Milestones — Event #{eventId}</h2></div>

      <form onSubmit={add} style={{display:"grid", gridTemplateColumns:"2fr 2fr 1fr auto", gap:10, alignItems:"end", marginBottom:8}}>
        <div className="field" style={{marginBottom:0}}><label>Name</label>
          <input required value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Venue booked" /></div>
        <div className="field" style={{marginBottom:0}}><label>Description</label>
          <input value={description} onChange={e=>setDescription(e.target.value)} placeholder="Optional" /></div>
        <div className="field" style={{marginBottom:0}}><label>Due date</label>
          <input type="date" required value={dueDate} onChange={e=>setDueDate(e.target.value)} /></div>
        <button type="submit" className="btn" style={{background:"var(--lavender)", color:"#fff", height:40}}><Icon.plus/> Add</button>
      </form>
      <div className="form-error">{error}</div>

      {sorted.length === 0 ? (
        <div style={{color:"var(--muted)", fontSize:"0.85rem"}}>No milestones for this event yet.</div>
      ) : sorted.map(m => (
        <div className="upcoming-item" key={m.id}>
          <div>
            <div className="upcoming-title">{m.name}</div>
            <div className="upcoming-date">
              <span className={m.dueDate < todayISO() ? "task-due overdue" : ""}>{formatNice(m.dueDate)}</span>
              {m.description ? " · " + m.description : ""}
            </div>
          </div>
          <button className="btn-icon btn-danger-ghost" onClick={()=>remove(m.id)} title="Delete"><Icon.trash/></button>
        </div>
      ))}
    </div>
  );
}

function NotificationsCard(){
  const [userId, setUserId] = useState(1);
  const [items, setItems] = useState([]);

  const load = useCallback(async () => {
    try{
      const res = await fetch(`${API_BASE}/notifications/user/${userId}`);
      setItems(res.ok ? await res.json() : []);
    }catch(e){ setItems([]); }
  }, [userId]);

  useEffect(() => {
    load();
    const t = setInterval(load, 10000);
    return () => clearInterval(t);
  }, [load]);

  const markRead = async (id) => {
    await fetch(`${API_BASE}/notifications/${id}/read`, { method:"PATCH" });
    load();
  };

  const unread = items.filter(n => !n.seen).length;

  return (
    <div className="card animate-in" id="notifications" style={{marginTop:22}}>
      <div className="card-head">
        <h2>Notifications {unread > 0 && <span className="badge HIGH" style={{marginLeft:8}}>{unread} new</span>}</h2>
        <div className="field" style={{marginBottom:0, display:"flex", alignItems:"center", gap:8}}>
          <label style={{margin:0}}>User ID</label>
          <input type="number" min="1" style={{width:80}} value={userId} onChange={e=>setUserId(Number(e.target.value)||1)} />
        </div>
      </div>
      {items.length === 0 ? (
        <div style={{color:"var(--muted)", fontSize:"0.85rem"}}>No notifications for this user.</div>
      ) : items.map(n => (
        <div className="upcoming-item" key={n.id} style={{opacity: n.seen ? 0.55 : 1}}>
          <div>
            <div className="upcoming-title">{n.message}</div>
            <div className="upcoming-date">{relativeTime(n.createdAt)}</div>
          </div>
          {!n.seen && <button className="btn btn-outline" style={{padding:"6px 12px"}} onClick={()=>markRead(n.id)}>Mark read</button>}
        </div>
      ))}
    </div>
  );
}

function MessagesCard({ eventId }){
  const [items, setItems] = useState([]);
  const [senderName, setSenderName] = useState("");
  const [senderRole, setSenderRole] = useState("COORDINATOR");
  const [content, setContent] = useState("");
  const [error, setError] = useState("");
  const ROLE_COLOR = { COORDINATOR:"var(--lavender-deep)", CUSTOMER:"var(--done)", VENDOR:"var(--med)" };

  const load = useCallback(async () => {
    try{
      const res = await fetch(`${API_BASE}/messages/event/${eventId}`);
      setItems(res.ok ? await res.json() : []);
    }catch(e){ setItems([]); }
  }, [eventId]);

  useEffect(() => { load(); }, [load]);

  const send = async (e) => {
    e.preventDefault();
    setError("");
    try{
      const res = await fetch(`${API_BASE}/messages`, {
        method:"POST", headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ eventId, senderName, senderRole, content })
      });
      if(!res.ok){ setError("Could not send message."); return; }
      setContent(""); load();
    }catch(err){ setError("Network error — is the API running?"); }
  };

  return (
    <div className="card animate-in" id="messages" style={{marginTop:22}}>
      <div className="card-head"><h2>Messages — Event #{eventId}</h2></div>

      <div style={{maxHeight:260, overflowY:"auto", marginBottom:14}}>
        {items.length === 0 ? (
          <div style={{color:"var(--muted)", fontSize:"0.85rem"}}>No messages yet.</div>
        ) : items.map(m => (
          <div className="activity-row" key={m.id}>
            <span className="avatar" style={{background:hashColor(m.senderName)}}>{initials(m.senderName)}</span>
            <div>
              <div className="activity-text">
                <strong>{m.senderName}</strong>{" "}
                <span className="badge" style={{background:"var(--bg)", color:ROLE_COLOR[m.senderRole], padding:"2px 8px"}}>{m.senderRole}</span>
              </div>
              <div className="activity-text" style={{marginTop:2}}>{m.content}</div>
              <div className="activity-time">{relativeTime(m.sentAt)}</div>
            </div>
          </div>
        ))}
      </div>

      <form onSubmit={send} style={{display:"grid", gridTemplateColumns:"1fr 1fr 3fr auto", gap:10, alignItems:"end"}}>
        <div className="field" style={{marginBottom:0}}><label>Your name</label>
          <input required value={senderName} onChange={e=>setSenderName(e.target.value)} placeholder="e.g. Nimal" /></div>
        <div className="field" style={{marginBottom:0}}><label>Role</label>
          <select value={senderRole} onChange={e=>setSenderRole(e.target.value)}>
            <option value="COORDINATOR">Coordinator</option>
            <option value="CUSTOMER">Customer</option>
            <option value="VENDOR">Vendor</option>
          </select></div>
        <div className="field" style={{marginBottom:0}}><label>Message</label>
          <input required value={content} onChange={e=>setContent(e.target.value)} placeholder="Type a message…" /></div>
        <button type="submit" className="btn" style={{background:"var(--lavender)", color:"#fff", height:40}}>Send</button>
      </form>
      <div className="form-error">{error}</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
