spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/event_planning_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Colombo}
    username: ${DB_USERNAME:eventapp}
    password: ${DB_PASSWORD:eventapp123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      adjust-dates-to-context-time-zone: false
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8081}

jwt:
  secret: ${JWT_SECRET:change-this-development-secret-key-to-at-least-32-characters}
  expiration: ${JWT_EXPIRATION:86400000}